<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- target face: tapered post topped by a circular head (the single hit/miss zone) -->
  <path d="M 134.118,200 L 128.824,75.441 A 31.765,31.765 0 1,1 171.176,75.441 L 165.882,200 Z" fill="none" stroke="#7c8790" stroke-width="2"/>

  <!-- point of aim: center of the circular head, not the shape's own bounding-box center -->
  <line x1="142" y1="51.765" x2="158" y2="51.765" stroke="#e8a33d" stroke-width="1.6"/>
  <line x1="150" y1="43.765" x2="150" y2="59.765" stroke="#e8a33d" stroke-width="1.6"/>

  <!-- width dimension -->
  <line x1="118.235" y1="215" x2="181.765" y2="215" stroke="#7c8790" stroke-width="1"/>
  <line x1="118.235" y1="210" x2="118.235" y2="220" stroke="#7c8790" stroke-width="1"/>
  <line x1="181.765" y1="210" x2="181.765" y2="220" stroke="#7c8790" stroke-width="1"/>

  <text x="150" y="250" text-anchor="middle" fill="#d9e0e6" font-size="20" font-weight="600">30 &#215; 85 cm</text>
</svg>
