<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- target face: nested 1x1m / 2x2m zones -->
  <rect x="20" y="20" width="180" height="180" fill="none" stroke="#7c8790" stroke-width="2"/>
  <rect x="65" y="65" width="90" height="90" fill="none" stroke="#7c8790" stroke-width="1.4"/>

  <!-- point of aim -->
  <line x1="102" y1="110" x2="118" y2="110" stroke="#e8a33d" stroke-width="1.6"/>
  <line x1="110" y1="102" x2="110" y2="118" stroke="#e8a33d" stroke-width="1.6"/>

  <!-- width dimension -->
  <line x1="20" y1="215" x2="200" y2="215" stroke="#7c8790" stroke-width="1"/>
  <line x1="20" y1="210" x2="20" y2="220" stroke="#7c8790" stroke-width="1"/>
  <line x1="200" y1="210" x2="200" y2="220" stroke="#7c8790" stroke-width="1"/>

  <text x="150" y="250" text-anchor="middle" fill="#d9e0e6" font-size="20" font-weight="600">2 &#215; 2 m</text>
</svg>
