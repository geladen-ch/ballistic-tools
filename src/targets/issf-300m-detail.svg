<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- target face, a few illustrative rings (not all 11, too fine at this scale) -->
  <circle cx="150" cy="110" r="90" fill="none" stroke="#7c8790" stroke-width="2"/>
  <circle cx="150" cy="110" r="65" fill="none" stroke="#7c8790" stroke-width="1.4"/>
  <circle cx="150" cy="110" r="40" fill="none" stroke="#7c8790" stroke-width="1.4"/>
  <circle cx="150" cy="110" r="15" fill="none" stroke="#7c8790" stroke-width="1.4"/>

  <!-- point of aim -->
  <line x1="142" y1="110" x2="158" y2="110" stroke="#e8a33d" stroke-width="1.6"/>
  <line x1="150" y1="102" x2="150" y2="118" stroke="#e8a33d" stroke-width="1.6"/>

  <!-- diameter dimension -->
  <line x1="60" y1="215" x2="240" y2="215" stroke="#7c8790" stroke-width="1"/>
  <line x1="60" y1="210" x2="60" y2="220" stroke="#7c8790" stroke-width="1"/>
  <line x1="240" y1="210" x2="240" y2="220" stroke="#7c8790" stroke-width="1"/>

  <text x="150" y="250" text-anchor="middle" fill="#d9e0e6" font-size="20" font-weight="600">&#216; 100 cm</text>
</svg>
