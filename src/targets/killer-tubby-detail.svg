<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- full canvas (dashed) with the hit/miss zone at the bottom, horizontally centered -->
  <rect x="100" y="20" width="100" height="200" fill="none" stroke="#7c8790" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M112.5,220 V86.67 H133.33 V53.33 H166.67 V86.67 H187.5 V220 Z" fill="none" stroke="#7c8790" stroke-width="2"/>

  <!-- point of aim -->
  <line x1="142" y1="136.67" x2="158" y2="136.67" stroke="#e8a33d" stroke-width="1.6"/>
  <line x1="150" y1="128.67" x2="150" y2="144.67" stroke="#e8a33d" stroke-width="1.6"/>

  <!-- canvas width dimension -->
  <line x1="100" y1="235" x2="200" y2="235" stroke="#7c8790" stroke-width="1"/>
  <line x1="100" y1="230" x2="100" y2="240" stroke="#7c8790" stroke-width="1"/>
  <line x1="200" y1="230" x2="200" y2="240" stroke="#7c8790" stroke-width="1"/>

  <text x="150" y="262" text-anchor="middle" fill="#d9e0e6" font-size="16" font-weight="600">60 &#215; 120 cm</text>
</svg>
