<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- target face: tapered post topped by a circular head (the single hit/miss zone) -->
  <path d="M 133.929,200 L 128.304,75.858 A 32.143,32.143 0 1,1 171.696,75.858 L 166.071,200 Z" fill="none" stroke="#7c8790" stroke-width="2"/>

  <!-- point of aim: center of the circular head, not the shape's own bounding-box center -->
  <line x1="142" y1="52.143" x2="158" y2="52.143" stroke="#e8a33d" stroke-width="1.6"/>
  <line x1="150" y1="44.143" x2="150" y2="60.143" stroke="#e8a33d" stroke-width="1.6"/>

  <!-- width dimension -->
  <line x1="117.857" y1="215" x2="182.143" y2="215" stroke="#7c8790" stroke-width="1"/>
  <line x1="117.857" y1="210" x2="117.857" y2="220" stroke="#7c8790" stroke-width="1"/>
  <line x1="182.143" y1="210" x2="182.143" y2="220" stroke="#7c8790" stroke-width="1"/>

  <text x="150" y="250" text-anchor="middle" fill="#d9e0e6" font-size="20" font-weight="600">20 &#215; 56 cm</text>
</svg>
