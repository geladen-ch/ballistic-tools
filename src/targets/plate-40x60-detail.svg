<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- plate outline -->
  <rect x="90" y="20" width="120" height="180" fill="none" stroke="#7c8790" stroke-width="2"/>

  <!-- point of aim -->
  <line x1="142" y1="110" x2="158" y2="110" stroke="#e8a33d" stroke-width="1.6"/>
  <line x1="150" y1="102" x2="150" y2="118" stroke="#e8a33d" stroke-width="1.6"/>

  <!-- width dimension -->
  <line x1="90" y1="215" x2="210" y2="215" stroke="#7c8790" stroke-width="1"/>
  <line x1="90" y1="210" x2="90" y2="220" stroke="#7c8790" stroke-width="1"/>
  <line x1="210" y1="210" x2="210" y2="220" stroke="#7c8790" stroke-width="1"/>

  <!-- height dimension -->
  <line x1="225" y1="20" x2="225" y2="200" stroke="#7c8790" stroke-width="1"/>
  <line x1="220" y1="20" x2="230" y2="20" stroke="#7c8790" stroke-width="1"/>
  <line x1="220" y1="200" x2="230" y2="200" stroke="#7c8790" stroke-width="1"/>

  <text x="150" y="250" text-anchor="middle" fill="#d9e0e6" font-size="20" font-weight="600">40 &#215; 60 cm</text>
</svg>
