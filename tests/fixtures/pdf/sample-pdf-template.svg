<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="0 0 21000 14800">
  <title>PDF template infrastructure: sample (test fixture), 1 user unit = 0.01 mm</title>
  <defs>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d6e4f0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect x="500" y="500" width="20000" height="13800" fill="url(#band)" stroke="#000" stroke-width="30"/>
  <g font-family="Overpass" fill="#111">
    <text x="10500" y="1800" font-size="800" font-weight="bold" text-anchor="middle">LABEL_TITLE</text>
    <text x="1000" y="3000" font-size="500">LABEL_DISTANCE: <tspan font-weight="700">[RANGE]</tspan></text>
    <text x="20000" y="3000" font-size="500" text-anchor="end">Дистанция · Höhe · ±0.1 mrad</text>
    <text x="1000" y="3800" font-size="400" style="font-weight:bold">[RANGE] (repeated)</text>
  </g>
  <g transform="translate(0 400)">
    <rect id="slot-fit" x="1000" y="4000" width="9000" height="9000" fill="none" stroke="#c00" stroke-width="30"/>
    <rect id="slot-clip" x="11000" y="4000" width="9000" height="9000" fill="none" stroke="#00c" stroke-width="30"/>
  </g>
</svg>
