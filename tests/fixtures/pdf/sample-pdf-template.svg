<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="0 0 210 148">
  <title>PDF template infrastructure: sample (test fixture)</title>
  <defs>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d6e4f0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="200" height="138" fill="url(#band)" stroke="#000" stroke-width="0.3"/>
  <g font-family="Overpass" fill="#111">
    <text x="105" y="18" font-size="8" font-weight="bold" text-anchor="middle">LABEL_TITLE</text>
    <text x="10" y="30" font-size="5">LABEL_DISTANCE: <tspan font-weight="700">[RANGE]</tspan></text>
    <text x="200" y="30" font-size="5" text-anchor="end">Дистанция · Höhe · ±0.1 mrad</text>
    <text x="10" y="38" font-size="4" style="font-weight:bold">[RANGE] (repeated)</text>
  </g>
  <g transform="translate(0 4)">
    <rect id="slot-fit" x="10" y="40" width="90" height="90" fill="none" stroke="#c00" stroke-width="0.3"/>
    <rect id="slot-clip" x="110" y="40" width="90" height="90" fill="none" stroke="#00c" stroke-width="0.3"/>
  </g>
</svg>
