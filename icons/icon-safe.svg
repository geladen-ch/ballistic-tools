<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Maskable/apple-touch-icon variant of icon.svg: background fills the
       full canvas edge-to-edge with no pre-rounded corners (Android's
       adaptive-icon mask and iOS's own corner-rounding both apply their
       own shape on top of this), and the mark is scaled 0.82x around
       center so its outermost points (the crosshair tips, originally at
       radius 44) land at radius ~36 — inside the ~40-radius safe zone
       Android's maskable-icon spec defines, with a small margin against
       stricter OEM mask shapes. See icon.svg for the unscaled original. -->
  <rect width="100" height="100" fill="#14181c"/>
  <g transform="translate(50,50) scale(0.82) translate(-50,-50)">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#e8a33d" stroke-width="5"/>
    <circle cx="50" cy="50" r="18" fill="none" stroke="#e8a33d" stroke-width="5"/>
    <path d="M24,74 L40,57 L50,63 L61,53 L76,74 Z" fill="#e8a33d"/>
    <circle cx="50" cy="50" r="4" fill="#e8a33d"/>
    <line x1="50" y1="6" x2="50" y2="22" stroke="#e8a33d" stroke-width="5"/>
    <line x1="50" y1="78" x2="50" y2="94" stroke="#e8a33d" stroke-width="5"/>
    <line x1="6" y1="50" x2="22" y2="50" stroke="#e8a33d" stroke-width="5"/>
    <line x1="78" y1="50" x2="94" y2="50" stroke="#e8a33d" stroke-width="5"/>
  </g>
</svg>
